<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearSpeak Login</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(120% 120% at 20% 20%, #5aa8ff 0%, #3a6ff7 35%, #2c4fd0 75%);
      color: #0f1b3d;
      padding: 16px;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      padding: 26px 26px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.7);
      display: grid;
      gap: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand img {
      height: 48px;
      width: auto;
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.01em;
      color: #0f1b3d;
    }
    .brand .by {
      font-size: 16px;
      font-weight: 700;
      color: #1f3f9c;
      margin-right: 4px;
    }
    h2 {
      margin: 4px 0 0;
      font-size: 18px;
      color: #1c2b55;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d6d9e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      outline: none;
      border-color: #3a6ff7;
      box-shadow: 0 0 0 3px rgba(58,111,247,0.15);
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #3a6ff7, #1f4fd4);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 25px rgba(58,111,247,0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(58,111,247,0.4); }
    button:active { transform: translateY(0); }
    .error { color: #c0392b; margin-top: 4px; }
    .footnote { font-size: 12px; color: #4a5a88; text-align: center; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand">
      <h1>ClearSpeak</h1>
      <span class="by">by</span>
      <img src="{{ url_for('static', filename='InnovaSpeechLogo.png') }}" alt="InnovaSpeech logo">
    </div>
    <h2>Enter Password</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus>
    <button type="submit">Unlock</button>
    <div class="footnote">Secure access to the ClearSpeak experience</div>
  </form>
</body>
</html>
